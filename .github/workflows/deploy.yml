name: Deploy

# Only main triggers this — main only ever receives merges from release,
# and release-checks.yml already gated that merge. No tests run here; this
# workflow trusts release's CI and focuses purely on shipping.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy-frontend:
    name: Build + deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Sync build output to S3
        run: aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"

  build-and-push-images:
    name: Build + push backend/ai images (GHCR)
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.lowercase }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize repository owner to lowercase
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-backend:latest
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-backend:${{ github.sha }}

      - name: Build + push ai image
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-ai:latest
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-ai:${{ github.sha }}

  migrate-database:
    name: Apply pending Prisma migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run pending migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-to-ec2:
    name: Pull new images + restart containers on EC2
    runs-on: ubuntu-latest
    needs: [deploy-frontend, build-and-push-images, migrate-database]
    steps:
      - name: SSH in, pull new images, restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /app/spendsense
            git pull
            GHCR_OWNER=${{ needs.build-and-push-images.outputs.owner }} IMAGE_TAG=${{ github.sha }} \
              docker compose -f docker-compose.prod.yml pull
            GHCR_OWNER=${{ needs.build-and-push-images.outputs.owner }} IMAGE_TAG=${{ github.sha }} \
              docker compose -f docker-compose.prod.yml up --detach

      - name: Poll health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf "${{ secrets.BACKEND_URL }}/api/v1/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check never passed after 10 attempts"
          exit 1
