name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload immutable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 30

  build-and-push-images:
    name: Build + push backend/ai images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.lowercase }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Normalize repository owner to lowercase
        id: owner
        run: echo "lowercase=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-backend:latest
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-backend:${{ github.sha }}

      - name: Build + push ai image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./ai
          file: ./ai/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-ai:latest
            ghcr.io/${{ steps.owner.outputs.lowercase }}/spendsense-ai:${{ github.sha }}

  migrate-database:
    name: Apply pending Prisma migrations to private RDS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Configure temporary AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_RDS_MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: spendsense-rds-migration-${{ github.run_id }}

      - name: Install AWS Session Manager plugin
        run: |
          curl --fail --show-error --silent --location \
            'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb' \
            --output "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg --install "$RUNNER_TEMP/session-manager-plugin.deb"
          session-manager-plugin --version

      - name: Open temporary SSM tunnel to RDS
        id: rds-tunnel
        env:
          AWS_RDS_MIGRATION_INSTANCE_ID: ${{ vars.AWS_RDS_MIGRATION_INSTANCE_ID }}
          RDS_HOST: ${{ vars.RDS_HOST }}
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/ssm-rds-tunnel.log"
          nohup aws ssm start-session \
            --target "$AWS_RDS_MIGRATION_INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSessionToRemoteHost \
            --parameters "{\"host\":[\"$RDS_HOST\"],\"portNumber\":[\"5432\"],\"localPortNumber\":[\"5433\"]}" \
            >"$LOG_FILE" 2>&1 &
          TUNNEL_PID=$!
          echo "pid=$TUNNEL_PID" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 5433; then
              echo 'SSM tunnel is listening on 127.0.0.1:5433.'
              exit 0
            fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              cat "$LOG_FILE" >&2 || true
              exit 1
            fi
            sleep 1
          done

          echo 'Timed out waiting for the SSM tunnel.' >&2
          cat "$LOG_FILE" >&2 || true
          exit 1

      - name: Run pending migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.RDS_MIGRATION_DATABASE_URL }}

      - name: Close temporary SSM tunnel
        if: ${{ always() }}
        env:
          TUNNEL_PID: ${{ steps.rds-tunnel.outputs.pid }}
        run: |
          if [ -n "$TUNNEL_PID" ] && kill -0 "$TUNNEL_PID" 2>/dev/null; then
            kill "$TUNNEL_PID"
            wait "$TUNNEL_PID" 2>/dev/null || true
          fi

  deploy-to-ec2:
    name: Pull new images + restart containers on EC2
    runs-on: ubuntu-latest
    needs: [build-frontend, build-and-push-images, migrate-database]
    env:
      GHCR_OWNER: ${{ needs.build-and-push-images.outputs.owner }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: SSH in, pull new images, restart
        id: deploy
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_OWNER,GHCR_READ_TOKEN,GITHUB_ACTOR,IMAGE_TAG
          script: |
            cd /app/spendsense
            git fetch origin main --tags
            git checkout --detach "$IMAGE_TAG"
            bash scripts/production-deploy.sh

      - name: Poll public readiness check
        id: readiness
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$BACKEND_URL/api/v1/health/ready" | jq -e '.data.status == "healthy" or .data.status == "degraded"' >/dev/null; then
              echo "Readiness check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Readiness check never passed after 10 attempts"
          exit 1

      - name: Run authenticated production smoke
        id: authenticated-smoke
        if: ${{ steps.readiness.outcome == 'success' }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: node scripts/production-auth-smoke.cjs

      - name: Roll back failed candidate
        id: rollback
        if: ${{ always() && (steps.readiness.outcome == 'failure' || steps.authenticated-smoke.outcome == 'failure') }}
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_OWNER,GHCR_READ_TOKEN,GITHUB_ACTOR
          script: |
            cd /app/spendsense
            bash scripts/production-rollback.sh

      - name: Verify public readiness after rollback
        id: rollback-readiness
        if: ${{ always() && steps.rollback.outcome == 'success' }}
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$BACKEND_URL/api/v1/health/ready" | jq -e '.data.status == "healthy" or .data.status == "degraded"' >/dev/null; then
              echo "Rollback readiness check passed"
              exit 0
            fi
            echo "Rollback attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Rollback readiness check never passed after 10 attempts"
          exit 1

      - name: Record successful candidate and prune previous local images
        if: ${{ steps.authenticated-smoke.outcome == 'success' }}
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_OWNER,IMAGE_TAG
          script: |
            cd /app/spendsense
            bash .deploy-state/production-mark-success.sh "$IMAGE_TAG"

      - name: Record successful rollback and prune failed candidate images
        if: ${{ always() && steps.rollback-readiness.outcome == 'success' }}
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_OWNER
          script: |
            cd /app/spendsense
            rollback_sha="$(cat .deploy-state/current-successful-sha 2>/dev/null || true)"
            if [ -z "$rollback_sha" ]; then
              echo 'Rollback release SHA was not recorded.' >&2
              exit 1
            fi
            bash .deploy-state/production-mark-success.sh "$rollback_sha"

  deploy-frontend:
    name: Deploy verified frontend artifact (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: [deploy-to-ec2]
    permissions:
      contents: read
    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Sync verified frontend artifact to S3
        env:
          S3_BUCKET_FRONTEND: ${{ secrets.S3_BUCKET_FRONTEND }}
        run: aws s3 sync frontend/dist/ "s3://$S3_BUCKET_FRONTEND" --delete

      - name: Invalidate CloudFront cache
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.CF_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
