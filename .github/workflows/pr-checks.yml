name: PR Checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend lint, test, build
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint -- --max-warnings=0

      - name: Test backend
        run: npm run test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -- --max-warnings=0

      - name: Build frontend
        run: npm run build

  ai:
    name: AI lint and test
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint AI service
        run: python -m ruff check .

      - name: Test AI service
        run: python -m pytest
