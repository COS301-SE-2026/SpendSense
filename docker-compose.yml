services:
  postgres:
    image: postgres:16
    container_name: spendsense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: spendsense_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: spendsense_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app:z
      - /app/node_modules
    depends_on:
      - postgres
      - ai

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: spendsense_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    depends_on:
      - backend

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile.dev
    container_name: spendsense_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai:/app

volumes:
  postgres_data:
  minio_data: