info:
  title: SpendSense Backend API
  description: API documentation for the SpendSense NestJS backend.
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Local backend
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UpdateProfileDto:
      type: object
      properties:
        displayName:
          type: string
          example: Kyle M
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: object
          example: https://example.com/avatar.png
          nullable: true
        monthlyBudget:
          type: number
          example: 5000
          minimum: 0
          maximum: 9999999999.99
        onboardingCompleted:
          type: boolean
          example: true
    UpdatePreferencesDto:
      type: object
      properties:
        theme:
          type: string
          enum:
            - LIGHT
            - DARK
            - SYSTEM
          example: LIGHT
        language:
          type: string
          example: en
          maxLength: 5
        currency:
          type: string
          enum:
            - ZAR
            - USD
            - EUR
            - GBP
          example: ZAR
        reducedMotion:
          type: boolean
          example: true
    CreateScheduleDto:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - ONCE
            - WEEKLY
            - MONTHLY
            - FIXED_INSTALLMENT
          example: MONTHLY
        interval:
          type: number
          example: 1
          default: 1
        dayOfMonth:
          type: number
          example: 1
          description: Day of month (1-28) for MONTHLY schedules
        totalOccurrences:
          type: number
          example: 6
          description: Total instalments - required for FIXED_INSTALLMENT
      required:
        - frequency
    CreateRemindersDto:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        daysBefore:
          example:
            - 3
            - 1
          type: array
          items:
            type: string
        channels:
          type: array
          example:
            - IN_APP
          items:
            type: string
            enum:
              - IN_APP
              - EMAIL
              - PUSH
              - SMS
    CreateObligationDto:
      type: object
      properties:
        name:
          type: string
          example: Netflix
        description:
          type: string
          example: Monthly streaming subscription
        type:
          type: string
          enum:
            - RENT
            - SUBSCRIPTION
            - BNPL
            - UTILITY
            - IOU
            - CUSTOM
          example: SUBSCRIPTION
        categoryId:
          type: string
          example: cat_subscriptions
          description: Valid category ID
        amount:
          type: number
          example: 199
        currency:
          type: string
          enum:
            - ZAR
            - USD
            - EUR
            - GBP
          example: ZAR
          default: ZAR
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          example: MEDIUM
          default: MEDIUM
        startDate:
          type: string
          example: '2026-05-01'
        endDate:
          type: string
          example: null
        schedule:
          $ref: '#/components/schemas/CreateScheduleDto'
        reminders:
          $ref: '#/components/schemas/CreateRemindersDto'
      required:
        - name
        - type
        - categoryId
        - amount
        - startDate
        - schedule
    UpdateScheduleDto:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - ONCE
            - WEEKLY
            - MONTHLY
            - FIXED_INSTALLMENT
        interval:
          type: number
        dayOfMonth:
          type: number
    UpdateObligationDto:
      type: object
      properties:
        name:
          type: string
          example: Netflix Premium
        description:
          type: string
        amount:
          type: number
          example: 229
        priority:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
        status:
          type: string
          enum:
            - ACTIVE
            - PAUSED
            - COMPLETED
            - CANCELLED
        endDate:
          type: string
          example: '2026-06-01'
        schedule:
          $ref: '#/components/schemas/UpdateScheduleDto'
        regenerateFutureOccurrences:
          type: boolean
          example: true
          description: Regenerate future unpaid occurrences after a schedule change
    BulkNotificationIdsDto:
      type: object
      properties: {}
    LogPaymentDto:
      type: object
      properties: {}
    UpdateReminderPreferencesDto:
      type: object
      properties:
        defaultReminderDaysBefore:
          type: number
          example: 3
          enum:
            - 1
            - 3
            - 5
            - 7
          description: Days before an occurrence is due to send reminder
        inAppEnabled:
          type: boolean
          example: true
          description: Whether the user will receive in app notifications
    CreateQuizSessionDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - DAILY
            - TOPIC
          example: DAILY
        topic:
          type: string
          enum:
            - BUDGETING
            - CREDIT_SCORE
            - INTEREST
            - DEBT
            - BNPL
            - SUBSCRIPTIONS
          example: CREDIT_SCORE
          description: Required when type is TOPIC.
      required:
        - type
    SubmitQuizAnswerDto:
      type: object
      properties:
        questionId:
          type: string
          example: question_123
        selectedOptionKey:
          type: string
          example: A
      required:
        - questionId
        - selectedOptionKey
    CreateFriendRequestDto:
      type: object
      properties: {}
    CreateWagerDto:
      type: object
      properties:
        opponentId:
          type: string
          example: 9f2d7f49-53a2-457c-8a50-8a9d22db83e4
          description: ID of the friend being challenged.
        taskType:
          type: string
          enum:
            - ALL_PAYMENTS_ON_TIME
            - NO_MISSED_PAYMENTS
            - MAINTAIN_PAYMENT_STREAK
          example: ALL_PAYMENTS_ON_TIME
          description: Task the participants will compete on.
        stakeAmount:
          type: number
          example: 50
          minimum: 0
          description: Coin amount staked by each participant.
        durationDays:
          type: number
          example: 7
          minimum: 1
          description: Length of the wager in days after acceptance.
      required:
        - opponentId
        - taskType
        - stakeAmount
        - durationDays
